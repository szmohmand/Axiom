name: AXIOM larger 2026 official-outcome independent-model historical validation
on:
  push:
    branches: [research/monthly-cohort-independent-validation-2026-11-15]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-cohort-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DEMO_MODE: '1'
      AUTO_PAPER: '0'
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated numerical research dependencies (not app runtime)
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt
          python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Require permanent regression history and prove no sample/lookahead corruption
        run: |
          python phase0/check_regression_history.py
          python -m pytest -q tests/test_monthly_cohort_replay.py tests/test_ingredient_ablation.py tests/test_window_specific_rerun.py tests/test_kalshieye_replay.py tests/test_challenger_lab.py
      - name: Authentic Binance archived one-minute exchange trades and official Kalshi multi-month result replay
        run: python -u -m research.monthly_cohort_replay
