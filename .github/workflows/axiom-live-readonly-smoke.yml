name: AXIOM read-only live provider smoke test
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEMO_MODE: '0'
      AUTO_PAPER: '0'
      DATA_PATH: '/tmp/axiom-provider-smoke.sqlite3'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Probe public Kalshi GET endpoints (no orders or credentials)
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tests/live_readonly_smoke.py | tee live-readonly-smoke-result.json
      - name: Prove live app cannot fall back to Coinbase without authenticated BRTI
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from app import main
          assert main.DEMO is False and main.AUTO_PAPER is False
          # Public-only runner has NO authenticated BRTI worker. Coinbase
          # must not be consulted to compensate for the missing index.
          def forbidden(*args, **kwargs):
              raise AssertionError('Production Coinbase price path was invoked')
          main.provider.price=forbidden
          main.provider.candles=forbidden
          main.provider.timeframe_candles=forbidden
          snapshot=main.update_once()
          health=main.health()
          state=main.get_state()
          assert snapshot['price_source']=='CF_BENCHMARKS_BRTI'
          assert 'brti_stream' in snapshot['errors']
          assert 'coinbase_ticker' not in snapshot['errors']
          assert 'coinbase_candles' not in snapshot['errors']
          assert snapshot['model']['available'] is False
          assert snapshot['opportunity']['side']=='WAIT'
          assert snapshot['trade_decision']['order_placed'] is False
          assert snapshot['manual_paper_available'] is False if 'manual_paper_available' in snapshot else True
          assert main.ledger.data()['count']['paper']==0
          assert health.status_code==503 and state.status_code==200
          print(json.dumps({'status':'PASS','live_benchmark':'AUTHENTICATED_BRTI_REQUIRED',
              'coinbase_fallback':False,'forecast':'WAIT',
              'paper_entries':0,'health_status':health.status_code},sort_keys=True))
          PY
      - name: Save probe output even if endpoints fail
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-readonly-smoke-result
          path: live-readonly-smoke-result.json
          if-no-files-found: warn
