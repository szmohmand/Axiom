name: AXIOM read-only live provider smoke test
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEMO_MODE: '0'
      AUTO_PAPER: '0'
      DATA_PATH: '/tmp/axiom-provider-smoke.sqlite3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Probe public Kalshi and Coinbase GET endpoints (no orders or credentials)
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tests/live_readonly_smoke.py | tee live-readonly-smoke-result.json
      - name: Inspect one-minute Coinbase intervals (read-only)
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json,time
          from app.feeds import LiveProvider
          p=LiveProvider()
          candles=p.candles()
          gaps=[{'index':i,'delta_seconds':b['t']-a['t']} for i,(a,b) in enumerate(zip(candles,candles[1:])) if b['t']-a['t'] != 60]
          tail=1
          for a,b in zip(reversed(candles[:-1]),reversed(candles[1:])):
              if b['t']-a['t'] != 60: break
              tail+=1
          print(json.dumps({'count':len(candles),'age_seconds':round(time.time()-candles[-1]['t']) if candles else None,'continuous_tail_minutes':tail,'gaps_last_64':gaps[-10:]},indent=2))
          if gaps:
              from datetime import datetime, timezone
              from app.feeds import COINBASE, normalize_candles
              from datetime import timedelta
              hole=gaps[-1]; a=candles[hole['index']]['t']; b=candles[hole['index']+1]['t']
              lo=datetime.fromtimestamp(a-60,timezone.utc)
              hi=datetime.fromtimestamp(b+60,timezone.utc)
              raw=p.get(COINBASE+'/products/BTC-USD/candles',{'start':lo.isoformat(),'end':hi.isoformat(),'granularity':60})
              recovered=normalize_candles(raw)
              print(json.dumps({'hole_between':[a,b],'narrow_refetch_times':[c['t'] for c in recovered]},indent=2))
          PY
      - name: Exercise actual application on real read-only feeds
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from app import main
          snapshot=main.update_once()
          health=main.health()
          state=main.get_state()
          result={
              'mode':snapshot['mode'],
              'status':snapshot['status'],
              'engine_count':len(snapshot['engines']),
              'scalp_side':snapshot['scalp']['side'],
              'opportunity_side':snapshot['opportunity']['side'],
              'health_http':health.status_code,
              'api_state_http':state.status_code,
              'auto_paper':main.AUTO_PAPER,
          }
          print(json.dumps(result,indent=2))
          assert main.AUTO_PAPER is False
          assert snapshot['status']=='LIVE',snapshot['errors']
          assert snapshot['model']['available']
          assert health.status_code==200
          assert state.status_code==200
          assert len(snapshot['engines'])==4
          PY
      - name: Save probe output even if endpoints fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-readonly-smoke-result
          path: live-readonly-smoke-result.json
          if-no-files-found: warn
