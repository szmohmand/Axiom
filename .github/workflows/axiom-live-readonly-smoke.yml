name: AXIOM read-only live provider smoke test
on:
  push:
    paths:
      - '.github/workflows/axiom-live-readonly-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEMO_MODE: '0'
      AUTO_PAPER: '0'
      DATA_PATH: '/tmp/axiom-provider-smoke.sqlite3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Probe public Kalshi and Coinbase GET endpoints (no orders, credentials or writes)
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tests/live_readonly_smoke.py | tee live-readonly-smoke-result.json
      - name: Save probe output even if endpoints fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-readonly-smoke-result
          path: live-readonly-smoke-result.json
          if-no-files-found: warn
