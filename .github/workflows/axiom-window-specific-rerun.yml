name: AXIOM independent period-specific historical comparison — opening, 10m, 5m, final 60s
on:
  push:
    branches: [research/window-specific-model-rerun-2026-11-15]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  period-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEMO_MODE: '1'
      AUTO_PAPER: '0'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Isolated research dependencies only; not used by AXIOM runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt
          python -m pip install --disable-pip-version-check pyarrow==23.0.1 xgboost==3.4.1 scikit-learn==1.7.2
      - name: All exact period and causal regression checks
        run: python -m pytest -q tests/test_window_specific_rerun.py tests/test_kalshieye_replay.py tests/test_challenger_lab.py
      - name: Authentic source replay and held-out independent model comparison
        run: python -m research.window_specific_rerun
