name: AXIOM research-only BRTI entitlement probe (no trading or deployments)
on:
  push:
    branches: [research/brti-secret-access-check-2026-11-15]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-brti:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEMO_MODE: '1'
      AUTO_PAPER: '0'
      PYTHONPATH: '.'
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ephemeral authenticated read-only requirements
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3 websockets==15.0.1
      - name: Strict one-shot sanitized BRTI access and entitlement diagnostics
        run: python -m research.brti_access_probe
