name: Research – accelerated remaining 180-day Kalshi collection
on:
  push:
    branches: [research/historical-data-completion-2026-11-16]
    paths: ['.github/workflows/axiom-180day-accelerated.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: public-180-accelerated
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pilot: ${{ steps.plan.outputs.pilot }}
      main: ${{ steps.plan.outputs.main }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          gh run download 43808575205 --repo szmohmand/Axiom --name PUBLIC_180_CONTRACT_INDEX --dir contract_index
          gh run view 43808575205 --repo szmohmand/Axiom --json jobs > legacy_jobs.json
          gh api --paginate 'repos/szmohmand/Axiom/actions/runs/43808575205/artifacts?per_page=100' --jq '.artifacts[] | {id,name,size_in_bytes,digest,created_at} | @json' > legacy_artifacts.jsonl
      - id: plan
        run: python -m research.accelerated_plan contract_index legacy_jobs.json legacy_artifacts.jsonl preservation
      - uses: actions/upload-artifact@v4
        with:
          name: ACCEL_PLAN
          path: preservation/
      - uses: actions/upload-artifact@v4
        with:
          name: ACCEL_CONTRACT_INDEX
          path: contract_index/
  pilot:
    needs: plan
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.pilot) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      DAY: ${{ matrix.day }}
      QUOTES: ${{ matrix.quotes }}
      TRADES: ${{ matrix.trades }}
      RESEARCH_GZIP_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: gh run download "$GITHUB_RUN_ID" --repo szmohmand/Axiom --name ACCEL_CONTRACT_INDEX --dir contract_index
      - name: Measure eight workers on real missing contract groups
        continue-on-error: true
        run: |
          args=()
          if [ "$QUOTES" != true ]; then args+=(--no-quotes); fi
          if [ "$TRADES" != true ]; then args+=(--no-trades); fi
          deadline=$(python -c 'import time;print(time.time()+900)')
          python -u -m research.accelerate_historical_180 --root pilot --index contract_index --day "$DAY" --offset 0 --limit 16 --deadline "$deadline" "${args[@]}"
      - name: Independently validate pilot source population
        if: always()
        continue-on-error: true
        run: python -m research.verify_public_180_day pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ACCEL_PILOT_${{ matrix.day }}_DATA
          path: pilot/
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ACCEL_PILOT_${{ matrix.day }}_SUMMARY
          path: |
            pilot/PERFORMANCE.json
            pilot/COLLECTION_STATUS.json
            pilot/INDEPENDENT_AUDIT.json
          retention-days: 30
  scale:
    if: always()
    needs: [plan,pilot]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      parallelism: ${{ steps.measure.outputs.parallelism }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh run download "$GITHUB_RUN_ID" --repo szmohmand/Axiom --pattern 'ACCEL_PILOT_*_SUMMARY' --dir metrics
      - id: measure
        run: |
          python - <<'PYCODE'
          import json,pathlib,os
          reports=[json.loads(p.read_text()) for p in pathlib.Path('metrics').rglob('PERFORMANCE.json')]
          audits=[json.loads(p.read_text()) for p in pathlib.Path('metrics').rglob('INDEPENDENT_AUDIT.json')]
          errors=sum(r.get('http_429',0)+r.get('network_errors',0) for r in reports)
          good=len(audits)==8 and all(a.get('independent_complete_population_audit_passed') for a in audits)
          parallel=16 if good and errors==0 else 8 if errors<8 else 4
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('parallelism='+str(parallel)+'\n')
          print(json.dumps({'pilot_workers':len(reports),'http_429':sum(r.get('http_429',0) for r in reports),'network_errors':sum(r.get('network_errors',0) for r in reports),'validated_pilot_groups':sum(a.get('independent_complete_population_audit_passed',False) for a in audits),'next_parallelism':parallel,'performance':reports}))
          PYCODE
  collect:
    if: always() && needs.plan.result == 'success' && needs.scale.result == 'success'
    needs: [plan,scale]
    strategy:
      max-parallel: ${{ fromJSON(needs.scale.outputs.parallelism) }}
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.main) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      DAY: ${{ matrix.day }}
      QUOTES: ${{ matrix.quotes }}
      TRADES: ${{ matrix.trades }}
      RESEARCH_GZIP_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Restore index and reuse verified pilot responses
        run: |
          gh run download "$GITHUB_RUN_ID" --repo szmohmand/Axiom --name ACCEL_CONTRACT_INDEX --dir contract_index
          gh run download "$GITHUB_RUN_ID" --repo szmohmand/Axiom --name "ACCEL_PILOT_${DAY}_DATA" --dir pilot_cache || true
          python - <<'PYCODE'
          import time,os
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('COLLECTION_DEADLINE='+str(time.time()+43*60)+'\n')
          PYCODE
      - name: Collect contract group 1 of 6 with deadline reserve
        if: always()
        continue-on-error: true
        run: |
          args=()
          if [ "$QUOTES" != true ]; then args+=(--no-quotes); fi
          if [ "$TRADES" != true ]; then args+=(--no-trades); fi
          python -u -m research.accelerate_historical_180 --root chunks/00 --index contract_index --day "$DAY" --offset 0 --limit 16 --deadline "$COLLECTION_DEADLINE" --cache-root pilot_cache/ORIGINAL_RESPONSES "${args[@]}"
      - name: Independently verify group 1
        if: always()
        continue-on-error: true
        run: python -m research.verify_public_180_day chunks/00
      - uses: actions/upload-artifact@v4
        if: always()
