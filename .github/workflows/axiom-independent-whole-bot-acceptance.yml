name: AXIOM independent whole-bot read-only worker acceptance (isolated)
on:
  push:
    branches:
      - integrate/axiom-binance-funding-lag-2026-11-20
      - integrate/axiom-intracontract-resale-2026-11-20
      - main
      - feature/axiom-brti-settlement-first-forecast-2026-11-22
      - feature/axiom-contract-repricing-full-test-gate-2026-11-22
      - deploy/axiom-oracle-preparation-2026-11-19
      - tests/axiom-full-lifecycle-audit-2026-11-17
      - fix/rollover-brti-execution-evidence-2026-11-17
      - integrate/axiom-live-brti-release-candidate-2026-11-18
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whole-bot-real-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DEMO_MODE: '0'
      AUTO_PAPER: '0'
      POLL_SECONDS: '5'
      DATA_PATH: '/tmp/axiom-independent-whole-bot-readonly.sqlite3'
      BRTI_LIVE_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install locked application and test packages
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Real worker polls and fail-closed BRTI-required forecasting without credentials
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python - <<'PY' | tee axiom-whole-bot-real-worker.jsonl
          import json,threading,time
          from fastapi.testclient import TestClient
          from app import main

          assert not main.DEMO and not main.AUTO_PAPER
          assert main.POLL_SECONDS == 5
          distinct_attempts=set()
          valid_depth=0
          start=time.monotonic()
          with TestClient(main.app) as client:
              threads={t.name for t in threading.enumerate()}
              assert {'research-data-worker','research-settlement-worker'}<=threads
              assert client.get('/').status_code==200
              while time.monotonic()-start<85:
                  h=client.get('/health')
                  response=client.get('/api/state')
                  assert response.status_code in (200,503)
                  state=response.json()
                  health=h.json()
                  # Public unauthenticated CI intentionally has NO BRTI
                  # WebSocket signer secrets. Coinbase is NOT a fallback.
                  assert state['price_source']=='CF_BENCHMARKS_BRTI' if 'price_source' in state else True
                  assert state.get('paper_auto_enabled') is False
                  assert main.ledger.data()['count']['paper']==0
                  assert (state['model'] or {}).get('available') is False
                  assert state['opportunity']['side']=='WAIT'
                  assert state['trade_decision']['order_placed'] is False
                  assert state['execution_intelligence']['order_placed'] is False
                  assert state['depth_opportunity']['read_only'] is True
                  assert state['manual_paper_available'] is False
                  assert state.get('forecast_warming') is not True
                  assert h.status_code==503
                  assert 'brti_stream' in health.get('errors',{}) or (
                      health.get('status')=='STARTING' and not health.get('errors'))
                  observed=state.get('last_attempt')
                  if observed is not None:
                      distinct_attempts.add(observed)
                  book=state.get('orderbook') or {}
                  if book.get('available'):
                      assert book['is_full_aggregated_depth']
                      assert book['individual_orders_visible'] is False
                      assert sum(book['levels'].values())>2
                      valid_depth+=1
                  print(json.dumps({'health':health['status'],
                      'market':(state.get('market') or {}).get('ticker'),
                      'source':state.get('price_source'),
                      'attempt':observed,'brti':state.get('live_briti',{}).get('status'),
                      'forecast':'WAIT','valid_book':book.get('available',False),
                      'paper_trades':0},sort_keys=True),flush=True)
                  if len(distinct_attempts)>=2 and valid_depth>=1:
                      break
                  time.sleep(5)
              assert len(distinct_attempts)>=2,'Real worker did not advance twice'
              assert valid_depth>=1,'Real Kalshi book was never validated'
              assert main.ledger.conn.execute(
                  'select count(*) from observations').fetchone()[0]==0
              assert client.post('/api/paper',json={'side':'YES'}).status_code==403
              assert client.post('/api/orders',json={}).status_code==404
          assert not any(t.name=='research-data-worker' and t.is_alive()
                         for t in threading.enumerate()),'Worker failed to shut down'
          print(json.dumps({'verdict':'PASS','no_coinbase_fallback':True,
              'polls':len(distinct_attempts),'live_depth_checks':valid_depth,
              'forecast_unavailable_until_authenticated_brti':True,
              'no_real_orders':True},sort_keys=True),flush=True)
          PY
      - name: Preserve real evidence even if acceptance fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: whole-bot-real-readonly-worker-evidence
          path: axiom-whole-bot-real-worker.jsonl
          if-no-files-found: warn
