name: AXIOM independent public Coinbase candle evidence probe
on:
  push:
    branches:
      - audit/complete-coverage-and-workflows-2026-11-17
      - fix/axiom-quantum-grade-resilience-coverage-2026-11-17
    paths:
      - '.github/workflows/coinbase-candle-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-source-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install project locked packages
        run: python -m pip install -r requirements.lock.txt
      - name: Verify authentic recovery on the historical missing-minute incident
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          from datetime import datetime,timezone
          from app.feeds import LiveProvider,KALSHI,COINBASE,contiguous_real_candle_suffix
          from app.engine import normalize_candles
          p=LiveProvider()
          start='2026-11-15T17:50:00+00:00'
          end='2026-11-15T18:55:00+00:00'
          raw=p.get(COINBASE+'/products/BTC-USD/candles',{'start':start,'end':end,'granularity':60})
          authentic=normalize_candles(raw)
          assert len(authentic)>=31, f'historical Coinbase returned only {len(authentic)} bars'
          usable, quality=contiguous_real_candle_suffix(authentic)
          assert len(usable)>=31 and quality['status'] in ('FULL','RECOVERED_REAL_CONTIGUOUS'),quality
          assert quality['missing_candles_filled']==0
          assert all(b['t']-a['t']==60 for a,b in zip(usable,usable[1:]))
          assert all(x in authentic for x in usable), 'Must use only source-supplied genuine market bars'
          assert usable[-1]['t']==authentic[-1]['t'],'Must use most recent genuine data'
          missing=int(datetime(2026,11,15,17,55,tzinfo=timezone.utc).timestamp())
          if missing not in [x['t'] for x in authentic]:
              assert missing not in [x['t'] for x in usable], 'Never fabricate the historical missing candle'
          print('ACTUAL HISTORICAL INCIDENT RECOVERY',{'raw':len(authentic),'used':len(usable),'quality':quality,'bar_at_1755_present':missing in [x['t'] for x in authentic]})
          PY
      - name: Compare timestamp coverage (no accounts, keys or orders)
        shell: bash
        run: |
          python - <<'PY'
          import requests,time,datetime,json
          S=requests.Session()
          S.headers['User-Agent']='AxiomReadOnlyAudit/1.0'
          now=int(time.time()//60)*60
          windows=[('incident',1794765300,1794765420),('rolling',now-68*60,now)]
          def fmt(t):return datetime.datetime.fromtimestamp(t,datetime.timezone.utc).isoformat()
          for label,start,end in windows:
              print('WINDOW',label,fmt(start),fmt(end),flush=True)
              left=(start//60)*60
              right=(end//60)*60
              urls=[
                ('exchange','https://api.exchange.coinbase.com/products/BTC-USD/candles',
                 {'start':fmt(start),'end':fmt(end),'granularity':60}),
                ('advanced','https://api.coinbase.com/api/v3/brokerage/market/products/BTC-USD/candles',
                 {'start':str(start),'end':str(end),'granularity':'ONE_MINUTE','limit':150})
              ]
              sets={}
              for source,url,params in urls:
                  try:
                      r=S.get(url,params=params,timeout=10);print(source,'HTTP',r.status_code,flush=True)
                      if r.status_code!=200:
                          print('BODY',r.text[:180]);continue
                      o=r.json()
                      rows=o.get('candles',[]) if source=='advanced' else o
                      ts=set(int(x['start']) if source=='advanced' else int(x[0]) for x in rows)
                      sets[source]=ts
                      missing=[t for t in range(left,right,60) if t not in ts]
                      print(source,'rows',len(rows),'missing_count',len(missing),'missing_first',list(map(fmt,missing[:9])),'range',(fmt(min(ts)),fmt(max(ts))) if ts else None,flush=True)
                  except Exception as e:print(source,'EXCEPTION',type(e).__name__,str(e)[:180],flush=True)
              if len(sets)==2:
                  primary_missing=set(range(left,right,60))-sets['exchange']
                  restored=primary_missing & sets['advanced']
                  print('PRIMARY_GAPS_RESTORED_BY_ADVANCED',len(restored),'examples',list(map(fmt,sorted(restored)[:10])),flush=True)
          PY
