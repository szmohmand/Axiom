name: AXIOM independent public Coinbase candle evidence probe
on:
  push:
    paths:
      - '.github/workflows/coinbase-candle-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-source-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project locked packages
        run: python -m pip install -r requirements.lock.txt
      - name: Compare timestamp coverage (no accounts, keys or orders)
        shell: bash
        run: |
          python - <<'PY'
          import requests,time,datetime,json
          S=requests.Session()
          S.headers['User-Agent']='AxiomReadOnlyAudit/1.0'
          now=int(time.time()//60)*60
          windows=[('incident',1794765300,1794765420),('rolling',now-68*60,now)]
          def fmt(t):return datetime.datetime.fromtimestamp(t,datetime.timezone.utc).isoformat()
          for label,start,end in windows:
              print('WINDOW',label,fmt(start),fmt(end),flush=True)
              left=(start//60)*60
              right=(end//60)*60
              urls=[
                ('exchange','https://api.exchange.coinbase.com/products/BTC-USD/candles',
                 {'start':fmt(start),'end':fmt(end),'granularity':60}),
                ('advanced','https://api.coinbase.com/api/v3/brokerage/market/products/BTC-USD/candles',
                 {'start':str(start),'end':str(end),'granularity':'ONE_MINUTE','limit':150})
              ]
              sets={}
              for source,url,params in urls:
                  try:
                      r=S.get(url,params=params,timeout=10);print(source,'HTTP',r.status_code,flush=True)
                      if r.status_code!=200:
                          print('BODY',r.text[:180]);continue
                      o=r.json()
                      rows=o.get('candles',[]) if source=='advanced' else o
                      ts=set(int(x['start']) if source=='advanced' else int(x[0]) for x in rows)
                      sets[source]=ts
                      missing=[t for t in range(left,right,60) if t not in ts]
                      print(source,'rows',len(rows),'missing_count',len(missing),'missing_first',list(map(fmt,missing[:9])),'range',(fmt(min(ts)),fmt(max(ts))) if ts else None,flush=True)
                  except Exception as e:print(source,'EXCEPTION',type(e).__name__,str(e)[:180],flush=True)
              if len(sets)==2:
                  primary_missing=set(range(left,right,60))-sets['exchange']
                  restored=primary_missing & sets['advanced']
                  print('PRIMARY_GAPS_RESTORED_BY_ADVANCED',len(restored),'examples',list(map(fmt,sorted(restored)[:10])),flush=True)
          PY
