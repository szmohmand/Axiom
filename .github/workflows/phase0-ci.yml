name: AXIOM complete regression and end-to-end checks
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.13']
    env:
      DEMO_MODE: '1'
      AUTO_PAPER: '0'
      DATA_PATH: '/tmp/axiom-phase0.sqlite3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - name: Verify preserved sources and secrets policy
        run: |
          python phase0/verify_transfer.py --checkout . --require-archives
      - name: Enforce permanent regression tests
        run: |
          python phase0/check_regression_history.py
      - name: Run ALL existing unit, recovery and synthetic end-to-end tests
        run: |
          python -m pytest -q
