name: Research export – missing older intervals for 180-day BRTI
on:
  push:
    branches: [research/historical-data-completion-2026-11-16]
    paths:
      - '.github/workflows/axiom-brti-180day-extension.yml'
  workflow_dispatch:
concurrency:
  group: axiom-brti-180day-extension-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  brti-history:
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include:
          - begin: '2026-05-20'
            end: '2026-06-19'
          - begin: '2026-06-19'
            end: '2026-07-19'
          - begin: '2026-07-19'
            end: '2026-08-06'
          - begin: '2026-08-13'
            end: '2026-08-18'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RESEARCH_BEGIN: ${{ matrix.begin }}
      RESEARCH_END: ${{ matrix.end }}
      RESEARCH_PREFLIGHT: '1'
      PYTHONPATH: '.'
      DEMO_MODE: '1'
      AUTO_PAPER: '0'
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated signing requirement only
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3
      - name: Fetch and verify official historical BRTI without saving keys
        run: python -u -m research.export_brti_interval
      - name: Verify all raw archive files are credentials-free
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path("interval_BRTI")
          assert root.is_dir()
          man=json.loads((root/"AUDIT"/"BRTI_30DAY_MANIFEST.json").read_text())
          assert man["hours_requested"]>0
          assert man["5hz_ticks_exported"]>0
          for p in root.rglob("*"):
              if p.is_file() and p.suffix==".json":
                  body=p.read_text()
                  assert os.environ["KALSHI_API_KEY_ID"] not in body
                  assert "BEGIN PRIVATE KEY" not in body
          print("BRTI_NO_SECRET_AND_COVERAGE_CHECK_PASS")
          PY
      - name: Preserve executable verification and handoff
        if: always()
        run: |
          cp research/export_brti_interval.py interval_BRTI/collector_reference.py
          cp reports/HISTORICAL_DATA_HANDOFF_2026-11-16.md interval_BRTI/README_START_HERE.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BRTI_ORIGINAL_JSON_5HZ_1HZ_${{ matrix.begin }}_to_${{ matrix.end }}_exclusive
          path: interval_BRTI/
          compression-level: 0
          if-no-files-found: error
          retention-days: 20
