name: AXIOM isolated real BTC historical replay and market-suitability checks
on:
  push:
    branches: [research/real-tick-replay-kalshieye-2026-11-15]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kalshieye-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEMO_MODE: '1'
      AUTO_PAPER: '0'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ephemeral research-only parquet and ML dependencies
        run: python -m pip install --disable-pip-version-check pyarrow==23.0.1 xgboost==3.4.1 scikit-learn==1.7.2
      - name: Inspect public dataset manifest (no code from source executed)
        run: python -m research.kalshieye_probe
      - name: Replay verified source snapshots, BTC spot proxies, independent models and official outcomes
        run: python -m research.kalshieye_replay
